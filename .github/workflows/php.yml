name: PHP Code Quality

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - '**.php'
      - '.phpcs.xml'
      - 'phpstan.neon.dist'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHPCS and PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must match composer.json's config.platform.php, .phpcs.xml's testVersion
      # and phpstan.neon.dist's phpVersion. Bumping PHP means editing all four.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: cs2pr

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --no-ansi

      - name: Run PHPCS
        id: phpcs
        run: composer phpcs -- --report-full --report-checkstyle=phpcs-report.xml

      - name: Annotate PR with PHPCS results
        if: ${{ always() && steps.phpcs.outcome == 'failure' }}
        run: cs2pr ./phpcs-report.xml

      # Always, so a PHPCS failure does not hide an unrelated type error behind it.
      - name: Run PHPStan
        if: ${{ always() }}
        run: composer phpstan
