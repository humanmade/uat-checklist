name: Tests

# Deliberately unfiltered by path, unlike php.yml and js.yml. The suites assert across
# file types that do not look related (the version test reads readme.txt and
# uat-checklist.php, the version-bump test reads .gitattributes), so any paths list
# narrow enough to be worth having is also narrow enough to skip the change that breaks
# one of them. The whole run is seconds.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version gate below diffs this branch against its base, which the default
          # shallow fetch does not bring down.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      # No install step: the suites are plain PHP and bash, and nothing in devDependencies
      # is on their path. Adding `npm ci` here would cost more than the tests take to run.
      - name: Run test suites
        run: npm test

      # Separate from the suites above: those are hermetic, this one judges the branch it
      # runs on, so it belongs to the PR rather than to `npm test`.
      - name: Check the version was raised
        run: bash .github/check-version-bump.sh "origin/${{ github.base_ref }}"
