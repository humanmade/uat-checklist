name: Tag and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0). Must match the plugin header Version.'
        required: true

permissions:
  contents: write

jobs:
  tag_and_release:
    name: Tag and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release
          # Full history and tags, so the tag-exists check below can see them.
          fetch-depth: 0

      - name: Abort if tag already exists
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} already exists."
            exit 1
          fi

      - name: Verify plugin header matches tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          header="$( sed -n 's/^ \* Version: *//p' uat-checklist.php | tr -d '[:space:]' )"
          if [ "${VERSION#v}" != "${header}" ]; then
            echo "::error::Tag ${VERSION} does not match plugin header Version: ${header}"
            exit 1
          fi

      - name: Resolve release commit
        id: commit
        run: echo "sha=$( git rev-parse HEAD )" >> "$GITHUB_OUTPUT"

      # GitHub's own source archive extracts to a version-named directory
      # (uat-checklist-1.0.0/), which becomes the plugin directory on a manual
      # wp-admin zip upload and so changes on every release. --prefix pins it.
      - name: Build plugin zip
        run: |
          git archive --format=zip \
            --prefix=uat-checklist/ \
            --output="${RUNNER_TEMP}/uat-checklist.zip" \
            HEAD

      # The release branch is stripped to the distributable tree before it is tagged, so
      # a zip missing the entrypoint means that strip took too much. build/panel.js
      # and build/blocks/checklist/block.json are checked as well: they only exist on the release branch, where the workflow
      # force-added it, and without it the plugin installs and does nothing.
      - name: Verify zip is installable
        run: |
          for path in uat-checklist/uat-checklist.php uat-checklist/build/panel.js uat-checklist/build/blocks/checklist/block.json; do
            if ! unzip -l "${RUNNER_TEMP}/uat-checklist.zip" | grep -qF "${path}"; then
              echo "::error::Built zip does not contain ${path}"
              unzip -l "${RUNNER_TEMP}/uat-checklist.zip"
              exit 1
            fi
          done

      - name: Create tag and GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ inputs.version }}
          commit: ${{ steps.commit.outputs.sha }}
          name: ${{ inputs.version }}
          artifacts: ${{ runner.temp }}/uat-checklist.zip
          generateReleaseNotes: true
          draft: false
          prerelease: false
