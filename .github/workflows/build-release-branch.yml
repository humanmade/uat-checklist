name: Build to "release" branch

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Update release branch
    uses: humanmade/hm-github-actions/.github/workflows/build-and-release-node.yml@1926fac5ec904aef6167fa3ba54477b0d9324462 # v0.4.0
    with:
      node_version: 24
      source_branch: main
      release_branch: release
      # build/ is gitignored on main. The shared action force-adds these after the
      # build script, which is the only reason the release branch carries any CSS or JS.
      built_asset_paths: 'build'
      # The shared action runs this between staging main's tree and committing it, which
      # is the only point at which the release commit's contents can be narrowed. The
      # strip runs last and before the force-add, so build/ is not in the index when
      # .github/strip-dev-files.sh reads it.
      build_script: |
        npm ci
        npm run build
        bash .github/strip-dev-files.sh
