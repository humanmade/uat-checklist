name: WordPress tests

# Separate from tests.yml, and unfiltered by path for the same reason. That job is plain PHP
# and bash and costs seconds. This one boots WordPress in Docker through wp-env, which costs
# minutes, and tests what only a real WordPress can answer: what wp_kses() keeps, what the
# HTML API does to a class, how a REST permission resolves. Keeping them apart means the
# fast job's verdict is not held up by the slow one's boot.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wp-tests:
    name: WordPress suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Before the site starts: wp-env mounts this directory, and the stylesheet and the
      # editor bundle are only registered when build/ exists. The suite fails on its own
      # if they are missing, rather than skipping the checks that need them.
      - name: Build
        run: npm run build

      - name: Start WordPress
        run: npx wp-env start

      - name: Run the WordPress suite
        run: npm run test:wp
