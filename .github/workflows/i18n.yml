name: Translations

# The POT is extracted from PHP, JavaScript and block.json alike, so a string added in any of them leaves the
# committed POT behind. This fails the pull request until `bin/i18n pot` has been run.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - '**.php'
      - 'src/**'
      - 'blocks/**'
      - 'languages/**'
      - 'bin/i18n'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n:
    name: POT matches the code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # WP-CLI's i18n commands parse files; they need neither WordPress nor a database.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: wp-cli

      # msgfmt validates the catalogs. It is not in the runner image, and bin/i18n check fails without it.
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Check translations
        run: bin/i18n check
